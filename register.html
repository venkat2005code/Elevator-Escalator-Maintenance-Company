<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | VertEx — Premium Elevator & Escalator Maintenance</title>
  <meta name="description" content="VertEx offers world-class elevator and escalator installation, maintenance, modernization, and compliance services with a 99.7% uptime guarantee." />
  <meta name="theme-color" content="#C9943A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/nav.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
</head>
<body>
  <div class="auth-toggles" style="position:absolute; top:2rem; right:2rem; z-index:100; display:flex; gap:1rem; align-items:center;">
    <button class="dir-toggle" id="dir-toggle" aria-label="Toggle text direction" title="Toggle RTL/LTR" style="background:transparent; border:none; color:var(--text-primary); cursor:pointer; display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
      <span class="dir-icon"><i class="ph ph-arrows-left-right"></i></span>
      <span class="dir-label" id="dir-label">LTR</span>
    </button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme" style="background:transparent; border:none; color:var(--text-primary); cursor:pointer; font-size:1.2rem; display:flex; align-items:center;">
      <span class="icon-moon"><i class="ph ph-moon"></i></span>
      <span class="icon-sun"><i class="ph ph-sun"></i></span>
    </button>
  </div>
<main id="page-content" style="margin-top: 0;">

  <div class="login-wrapper">
    <!-- Left Brand Panel -->
    <div class="login-left">
    </div>

    <!-- Right Login Form -->
    <div class="login-right">
      <div class="login-card">
                <a href="index.html" style="text-align:center; margin-bottom: 1.5rem; display:block; text-decoration:none;">
          <img src="assets/images/logo.png" alt="VertEx Logo" class="nav-logo-img" style="width:56px; height:56px; margin:0 auto; display:block;" />
          <div style="font-family:var(--font-display); font-size:1.8rem; font-weight:900; color:var(--text-primary); margin-top:0.5rem; letter-spacing:0.02em; text-transform:uppercase;">VertEx</div>
        </a>
        <div id="register-panel">
          <div class="login-title">Create Account</div>
          <p class="login-sub">Register for your VertEx client portal</p>
          <form class="login-form" action="dashboard-user.html">
            <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="reg-name" type="text" placeholder="Jane Doe" required/></div>
            <div class="form-group"><label class="form-label">Company Name</label><input class="form-input" id="reg-company" type="text" placeholder="Acme Tower" required/></div>
            <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" id="reg-email" type="email" placeholder="client@company.com" required/></div>
            <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="reg-pass" type="password" placeholder="••••••••" required/></div>
            <button class="btn btn-gold w-full" style="justify-content:center; margin-top:0.5rem" type="submit">Create My Profile →</button>
          </form>
          
          <div class="login-divider">or continue with</div>
          
          <div style="display:flex; justify-content:center; gap:1rem; margin-bottom:1.5rem">
            <button type="button" class="btn btn-outline" style="flex:1; padding:0.6rem; justify-content:center" title="Google"><svg width="22" height="22" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg></button>
            <button type="button" class="btn btn-outline" style="flex:1; padding:0.6rem; justify-content:center" title="Apple"><svg width="22" height="22" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></button>
            <button type="button" class="btn btn-outline" style="flex:1; padding:0.6rem; justify-content:center" title="Facebook"><i class="ph ph-facebook-logo" style="font-size:1.25rem"></i></button>
          </div>

          <div style="text-align:center; font-size:.8rem; color:var(--text-muted)">Already have an account? <a style="color:var(--gold); cursor:pointer; text-decoration:none" href="login.html">Sign in</a></div>
        </div>
      </div>
    </div>
  </div>
</main>
<!-- ════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════ -->
<script src="assets/js/nav.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
